name: Update answer word list

# Every evening at 8 p.m. New York time, fetches word.tips' "NYT Wordle answers"
# list and adds any new words to words.js (add-only; nothing is ever removed).
# The app loads words.js network-first, so new words are there the next time
# the app is opened online.
#
# GitHub schedules are in UTC: 00:05 UTC is 8:05 p.m. EDT (summer) and 01:05 UTC is
# 8:05 p.m. EST (winter). The other run lands at 7:05 or 9:05 p.m. and does no harm.
# GitHub often starts scheduled runs late (hours, at busy times).
#
# To run it by hand: Actions tab -> "Update answer word list" -> Run workflow.

on:
  schedule:
    - cron: '5 0 * * *'
    - cron: '5 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wordlist-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Add new answers from word.tips
        run: node update-wordlist.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- words.js; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add words.js
          git commit -m "Add new answers from word.tips ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push
